# SPDX-License-Identifier: AGPL-3.0-or-later
name: publish media-proxy (fork)

# Builds the media-proxy image from this fork and pushes it to GHCR as
# ghcr.io/<owner>/fluxer-media-proxy:latest. The upstream build-media-proxy
# workflow needs the upstream org's GitHub App, so it cannot run on a fork.
on:
  push:
    branches: [potryasker]
    paths:
      - fluxer_media_proxy/**
      - fluxer_common/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/publish-media-proxy-fork.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-media-proxy-fork
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig
      - name: resolve image name
        id: meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/fluxer-media-proxy" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --pretty=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: fluxer_media_proxy/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.sha }}
            SOURCE_SHA=${{ github.sha }}
            SOURCE_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
