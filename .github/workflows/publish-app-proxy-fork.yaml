# SPDX-License-Identifier: AGPL-3.0-or-later
name: publish app-proxy (fork)

# Builds the self-hosted app-proxy image (web client + proxy) from this fork and
# pushes it to GHCR. Point a deployment at it with:
#   FLUXER_REGISTRY_OWNER=<github owner, lowercase>
#   FLUXER_IMAGE_TAG=latest
#
# Everything is compiled on the runner with caches (pnpm store, wasm artifacts,
# proxy binary); Docker only packages the results (fluxer_app_proxy/Dockerfile.fork).
on:
  push:
    branches: [potryasker]
    paths:
      - fluxer_app/**
      - fluxer_app_proxy/**
      - fluxer_common/**
      - packages/**
      - patches/**
      - tools/ci/**
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfigs/**
      - .github/workflows/publish-app-proxy-fork.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-proxy-fork
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig
      - name: resolve image name
        id: meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/fluxer-app-proxy-self-hosted" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --pretty=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          mkdir .fork-build

      - name: set up Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown

      # Proxy binary: only changes with the proxy sources, so cache it whole.
      - name: restore proxy binary
        id: proxy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .fork-build/fluxer-app-proxy
          key: >-
            app-proxy-bin-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'fluxer_app_proxy/Cargo.toml', 'fluxer_app_proxy/src/**', 'fluxer_common/Cargo.toml',
            'fluxer_common/src/**', 'packages/constants/src/AgeGeos.json') }}
      - name: build proxy binary
        if: steps.proxy.outputs.cache-hit != 'true'
        run: |
          cargo build --release -p fluxer_app_proxy
          cp target/release/fluxer_app_proxy .fork-build/fluxer-app-proxy

      # The wasm crates (markdown parser, libfluxcore, libfluxwebp) only change
      # when their Rust sources do. Same key as tests.yaml.
      - name: restore wasm artifacts
        id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            fluxer_app/pkgs/libfluxcore
            fluxer_app/pkgs/libfluxwebp
            fluxer_app/src/features/messaging/utils/markdown/parser/MarkdownParserWasmBytes.ts
          key: >-
            app-wasm-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'tools/ci/src/app_wasm.rs',
            'tools/ci/templates/libfluxcore_wrapper.js', 'tools/ci/templates/libfluxcore_wrapper.d.ts',
            'fluxer_app/rust/libfluxcore/Cargo.toml', 'fluxer_app/rust/libfluxcore/Cargo.lock',
            'fluxer_app/rust/libfluxcore/.cargo/config.toml', 'fluxer_app/rust/libfluxcore/src/**',
            'fluxer_app/rust/libfluxwebp/Cargo.toml', 'fluxer_app/rust/libfluxwebp/Cargo.lock',
            'fluxer_app/rust/libfluxwebp/src/**', 'fluxer_app/rust/libfluxwebp/shim/**',
            'fluxer_app/rust/libfluxwebp/simd/**',
            'packages/markdown_parser/rust/Cargo.toml', 'packages/markdown_parser/rust/.cargo/config.toml',
            'packages/markdown_parser/rust/src/**') }}
      - name: build wasm artifacts
        if: steps.wasm.outputs.cache-hit != 'true'
        run: tools/ci/run.sh build-app-wasm

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile --filter 'fluxer_app...'
      - name: build web client
        working-directory: fluxer_app
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.sha }}
          PUBLIC_ASSET_BASE_URL: ""
        # The wasm artifacts are already in place; making FLUXER_CI_BIN a no-op
        # turns `pnpm wasm:codegen` (tools/ci/run.sh) into nothing instead of a
        # full rebuild.
        run: FLUXER_CI_BIN=/usr/bin/true pnpm build
      - name: precompress assets
        run: |
          sudo apt-get install -y --no-install-recommends brotli
          cp -a fluxer_app/dist .fork-build/assets
          PRECOMPRESS_BROTLI_QUALITY=9 fluxer_app_proxy/scripts/precompress_assets.sh .fork-build/assets

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .fork-build
          file: fluxer_app_proxy/Dockerfile.fork
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.sha }}
            SOURCE_SHA=${{ github.sha }}
            SOURCE_DATE=${{ steps.meta.outputs.date }}
