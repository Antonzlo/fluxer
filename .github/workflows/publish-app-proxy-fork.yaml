# SPDX-License-Identifier: AGPL-3.0-or-later
name: publish app-proxy (fork)

# Builds the self-hosted app-proxy image (web client + proxy) from this fork and
# pushes it to GHCR. Point a deployment at it with:
#   FLUXER_REGISTRY_OWNER=<github owner, lowercase>
#   FLUXER_IMAGE_TAG=latest
on:
  push:
    branches: [potryasker]
    paths:
      - fluxer_app/**
      - fluxer_app_proxy/**
      - fluxer_common/**
      - packages/**
      - patches/**
      - tools/ci/**
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfigs/**
      - .github/workflows/publish-app-proxy-fork.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-proxy-fork
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig
      - name: resolve image name
        id: meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/fluxer-app-proxy-self-hosted" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --pretty=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: fluxer_app_proxy/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.sha }}
            SOURCE_SHA=${{ github.sha }}
            SOURCE_DATE=${{ steps.meta.outputs.date }}
            PRECOMPRESS_BROTLI_QUALITY=9
          # No layer cache: exporting it (mode=max) took ~6.5 min per run, far
          # more than the ~2 min of toolchain/install layers it saved.
